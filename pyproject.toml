[project]
name = "terminal-reader"
version = "0.1.0"
description = "Read PDF files inside your terminal."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.23"]

[project.scripts]
tread = "terminal_reader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
